name: Build gta4l kernel (SukiSU, no /proc/config.gz)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      ARCH: arm64
      SUBARCH: arm64

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev make git curl zip python3 cpio rsync \
            device-tree-compiler

      - name: Show toolchain versions
        run: |
          clang --version | head -1
          ld.lld --version | head -1
          echo "cores: $(nproc)"
          df -h /

      - name: Clone kernel source (LineageOS sm6115, lineage-23.2)
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_kernel_samsung_sm6115.git kernel
          cd kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile

      - name: Integrate SukiSU (builtin)
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          echo "--- KSU dirs after setup ---"
          ls -d KernelSU 2>/dev/null || true

      - name: Generate .config (defconfig + gta4l fragment)
        working-directory: kernel
        run: |
          make O=out LLVM=1 vendor/bengal-perf_defconfig
          scripts/kconfig/merge_config.sh -O out \
            out/.config arch/arm64/configs/vendor/gta4l-common.config
          make O=out LLVM=1 olddefconfig
          echo "--- sanity checks ---"
          grep -c "^CONFIG_" out/.config
          grep -E "CONFIG_GTA4L_DTB|CONFIG_SEC_BSP|CONFIG_QCA_CLD_WLAN" out/.config || true

      - name: Disable /proc/config.gz (core change)
        working-directory: kernel
        run: |
          ./scripts/config --file out/.config -d IKCONFIG_PROC
          ./scripts/config --file out/.config -d IKCONFIG
          make O=out LLVM=1 olddefconfig
          echo "--- IKCONFIG after patch ---"
          grep -i ikconfig out/.config || echo "OK: no IKCONFIG entries remain"

      - name: Verify KSU config present
        working-directory: kernel
        run: |
          grep -E "CONFIG_KSU" out/.config | head -20 || echo "(no CONFIG_KSU entries!)"

      - name: Build vmlinux
        working-directory: kernel
        run: make O=out LLVM=1 LLVM_IAS=1 -j$(nproc) vmlinux 2>&1 | tail -250

      - name: Build Image
        working-directory: kernel
        run: |
          make O=out LLVM=1 LLVM_IAS=1 -j$(nproc) arch/arm64/boot/Image 2>&1 | tail -120
          ls -la out/arch/arm64/boot/

      - name: Show build result
        working-directory: kernel
        run: |
          cat out/include/config/kernel.release
          ls -la out/arch/arm64/boot/Image*

      - name: Fetch AnyKernel3 scaffold
        run: |
          git clone --depth=1 https://github.com/KeiraOMG0/gta4lwifi_kernel_ksu.git ref
          cp -r ref/AnyKernel3 ak3
          rm -rf ak3/.git
          ls -la ak3 | head -20

      - name: Package AnyKernel3 zip
        run: |
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          rm -f ./*.zip
          zip -r9 ../gta4l-kernel-ksu.zip . -x '.git/*' -x '.github/*'
          cd ..
          ls -la gta4l-kernel-ksu.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-kernel-ksu
          path: |
            gta4l-kernel-ksu.zip
            kernel/out/arch/arm64/boot/Image
          if-no-files-found: error
